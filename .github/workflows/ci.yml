name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
      - name: Sync and test
        run: |
          uv sync --all-groups
          uv run ruff check src tests
          uv run pytest -q
        working-directory: ${{ github.workspace }}
