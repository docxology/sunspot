name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"
      - name: Sync and test
        run: |
          uv sync --all-groups
          uv run ruff check src tests
          uv run pytest -q
        working-directory: ${{ github.workspace }}
